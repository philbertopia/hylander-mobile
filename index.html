<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d9198">
    <meta
      name="description"
      content="Hylander Mobile food truck menu for Kingston, NY."
    >
    <meta property="og:title" content="Hylander Mobile Menu">
    <meta property="og:description" content="Scan to view the Hylander Mobile food truck menu.">
    <meta property="og:image" content="img/random-menus/ChatGPT Image May 16, 2026, 04_20_26 PM.png">
    <title>Hylander Mobile Menu</title>
    <link rel="preload" as="image" href="img/random-menus/ChatGPT Image May 16, 2026, 04_20_26 PM.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a class="brand" href="index.html" aria-label="Hylander Mobile home">
          <span class="brand-mark">H</span>
          <span>
            <strong>Hylander Mobile</strong>
            <small>Kingston, NY</small>
          </span>
        </a>

        <div class="nav-links">
          <a href="#menu">Menu</a>
          <a href="img/random-menus/ChatGPT Image May 16, 2026, 04_20_26 PM.png" target="_blank" rel="noopener" data-random-menu-link>Open Image</a>
          <a href="img/random-menus/ChatGPT Image May 16, 2026, 04_20_26 PM.png" download data-random-menu-link>Download</a>
        </div>
      </nav>
    </header>

    <main class="menu-page" aria-label="Hylander Mobile menu">
      <figure class="menu-frame" id="menu">
        <img
          class="menu-image"
          id="random-menu-image"
          src="img/random-menus/ChatGPT Image May 16, 2026, 04_20_26 PM.png"
          alt="Hylander Mobile food truck menu with prices for chop cheese, chop chicken, pierogis, wings, sliders, sides, desserts, mango, water, and Gatorade."
        >
      </figure>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>
          <strong>Hylander Mobile</strong>
          <span>Little cart. Big flavor.</span>
        </div>
        <div>
          <span>Kingston, NY</span>
          <a href="https://www.instagram.com/hylandermobile" target="_blank" rel="noopener">@hylandermobile</a>
        </div>
        <div>
          <span>Cash preferred</span>
          <span>PayPal: hylanrappaport1</span>
        </div>
        <div class="footer-credit">
          <p>Website by <a href="https://tree-rouge.vercel.app/" target="_blank" rel="noopener">TREE</a></p>
        </div>
      </div>
    </footer>

    <script>
      const menuImages = [
        "img/random-menus/ChatGPT Image May 16, 2026, 04_20_26 PM.png",
        "img/random-menus/ChatGPT Image May 16, 2026, 04_40_20 PM.png",
        "img/random-menus/ChatGPT Image May 16, 2026, 04_45_59 PM.png",
        "img/random-menus/ChatGPT Image May 16, 2026, 04_48_11 PM.png",
        "img/random-menus/ChatGPT Image May 16, 2026, 04_50_01 PM.png"
      ];

      const randomMenu = menuImages[Math.floor(Math.random() * menuImages.length)];
      const menuImage = document.querySelector("#random-menu-image");
      const menuLinks = document.querySelectorAll("[data-random-menu-link]");

      menuImage.src = randomMenu;
      menuLinks.forEach((link) => {
        link.href = randomMenu;
      });
    </script>
  </body>
</html>
